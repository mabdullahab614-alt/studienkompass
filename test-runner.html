<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studienkompass — Test Runner</title>
<style>
  body{font-family:'Courier New',monospace;background:#0A0A0C;color:#F3F3F1;padding:32px;max-width:760px;margin:0 auto}
  h1{font-size:1.3rem;margin-bottom:4px}
  p.sub{color:#A8A8AC;font-size:.85rem;margin-bottom:24px}
  .test-summary{padding:12px 16px;border-radius:8px;font-weight:700;margin-bottom:16px}
  .test-summary-pass{background:rgba(31,157,107,.16);color:#1F9D6B}
  .test-summary-fail{background:rgba(201,32,45,.16);color:#C9202D}
  .test-list{list-style:none;padding:0;margin:0}
  .test-item{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-size:.85rem}
  .test-pass{color:#A8A8AC}
  .test-pass::marker,.test-pass{color:#A8A8AC}
  .test-fail{color:#C9202D;font-weight:600}
</style>
</head>
<body>

<h1>Studienkompass — Scoring Engine Tests</h1>
<p class="sub">Pure browser JS test runner. No Node, no npm, no build step — just open this file.</p>
<div id="output"></div>

<script src="test-framework.js"></script>
<script src="scoring-engine.js"></script>
<script src="scoring_tests.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function(){
    TestFramework.runTests(document.getElementById('output'));
  });
</script>

</body>
</html>
